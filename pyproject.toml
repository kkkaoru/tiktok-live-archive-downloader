[project]
name = "tiktok-live-archive-downloader"
version = "0.1.0"
description = "Local downloader for authorized, observed replay media"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "regex>=2024.11.6"]

[project.optional-dependencies]
editing = [
    "fonttools>=4.61,<5",
    "numpy>=2.2,<3",
    "opencv-python-headless>=4.10,<5",
    "vibrato==0.2.3",
]
separation = ["demucs>=4.1,<5", "numpy>=1.26,<2"]
roformer = ["mlx-audio==0.4.3", "numpy>=2.2,<3"]
dialogue-separation = ["mlx-audio[sts]==0.5.7", "numpy>=2.2,<3", "scipy>=1.12,<2"]
ja-alignment = ["nagisa==0.3.0", "pykakasi==2.3.0"]
ctc-alignment = ["torch==2.6.0", "transformers==5.17.0", "numpy>=1.26,<3", "scipy>=1.12,<2"]
coreml-extraction = ["coremltools>=9,<10; sys_platform == 'darwin'"]
usef-extraction = ["torch==2.6.0", "numpy>=1.26,<2", "scipy>=1.12,<2"]
speaker-extraction = [
    "torch==2.2.2", "torchaudio==2.2.2", "numpy>=1.26,<2",
    "scipy>=1.12,<2", "huggingface-hub>=0.34,<2", "speechbrain==1.0.3",
]
capture = ["mitmproxy>=11,<13"]
device = [
    "frida-tools>=14.10.4",
    "pymobiledevice3>=11.12.1",
]
web = [
    "playwright>=1.62.0",
]
youtube = [
    "mlx-whisper>=0.4.3",
    "yt-dlp[default]>=2026.8.19",
]

[dependency-groups]
dev = [
    "fonttools>=4.61,<5",
    "hatchling==1.32.4",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.11",
    "mypy>=1.15",
    "types-regex>=2024.11.6",
    "numpy>=2.2,<3",
    "opencv-python-headless>=4.10,<5",
    "vibrato==0.2.3",
]

[project.scripts]
replay = "replay.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.uv]
conflicts = [
    [{ extra = "separation" }, { group = "dev" }],
    [{ extra = "separation" }, { extra = "editing" }],
    [{ extra = "separation" }, { extra = "roformer" }],
    [{ extra = "speaker-extraction" }, { group = "dev" }],
    [{ extra = "speaker-extraction" }, { extra = "editing" }],
    [{ extra = "speaker-extraction" }, { extra = "roformer" }],
    [{ extra = "dialogue-separation" }, { extra = "roformer" }],
    [{ extra = "dialogue-separation" }, { extra = "separation" }],
    [{ extra = "dialogue-separation" }, { extra = "speaker-extraction" }],
    [{ extra = "usef-extraction" }, { extra = "speaker-extraction" }],
    [{ extra = "usef-extraction" }, { extra = "separation" }],
    [{ extra = "usef-extraction" }, { extra = "editing" }],
    [{ extra = "usef-extraction" }, { extra = "roformer" }],
    [{ extra = "usef-extraction" }, { extra = "dialogue-separation" }],
    [{ extra = "usef-extraction" }, { group = "dev" }],
    [{ extra = "ctc-alignment" }, { extra = "speaker-extraction" }],
    [{ extra = "ctc-alignment" }, { extra = "separation" }],
]

[tool.hatch.build]
skip-excluded-dirs = true
exclude = [
    "/private", "/downloads", "/edits", "/youtube-originals",
    "/captures", "/screenshots", "/browser-state", "/backups",
]

[tool.hatch.build.targets.wheel]
sources = ["src"]
include = ["src/replay/*.py", "src/replay/py.typed"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/replay/*.py", "/src/replay/py.typed", "/tests/test_*.py", "/tests/conftest.py",
    "/tests/stateful_guard_fixture.py",
    "/docs/*.md", "/scripts/*.sh", "/.github/workflows/*.yml",
    "/README.md", "/SECURITY.md", "/AGENTS.md", "/pyproject.toml", "/uv.lock", "/Makefile",
    "/.agents/skills/*/SKILL.md",
    "/.python-version", "/.gitignore", "/.gitleaks.toml",
    "/TranscriptViewer/Package.swift", "/TranscriptViewer/Package.resolved",
    "/TranscriptViewer/.swift-format", "/TranscriptViewer/build-app.sh",
    "/TranscriptViewer/Sources/TranscriptCore/*.swift",
    "/TranscriptViewer/Sources/TranscriptViewer/*.swift",
    "/TranscriptViewer/Sources/TranscriptCheck/*.swift",
    "/TranscriptViewer/Sources/TranscriptSummaries/*.swift",
    "/TranscriptViewer/Sources/TranscriptSummaryCLI/*.swift",
    "/TranscriptViewer/Tests/TranscriptCoreTests/*.swift",
    "/TranscriptViewer/App/Info.plist", "/TranscriptViewer/App/generate-icon.py",
    "/TranscriptViewer/App/generate-icon.sh",
    "/native/apple-pro-apps/Package.swift", "/native/apple-pro-apps/Package.resolved",
    "/native/apple-pro-apps/README.md",
    "/native/apple-pro-apps/Sources/ProAppsCore/*.swift",
    "/native/apple-pro-apps/Sources/AppleProApps/*.swift",
    "/native/apple-pro-apps/Tests/ProAppsCoreTests/*.swift",
    "/native/apple-pro-apps/Tests/ProAppsNativeTests/*.swift",
    "/native/apple-pro-apps/Tests/AppleProAppsTests/*.swift",
    "/native/apple-pro-apps/Tests/UIFixture/main.swift",
    "/native/apple-pro-apps/Tests/ProAppsNativeTests/Fixtures/README.md",
    "/native/apple-pro-apps/Tests/ProAppsNativeTests/Fixtures/black.mp4",
    "/native/apple-pro-apps/Tests/ProAppsNativeTests/Fixtures/quadrants-30.mp4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p replay.pytest_scratch --cov=replay --cov-report=term-missing"
