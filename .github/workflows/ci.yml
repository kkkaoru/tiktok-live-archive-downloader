name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.8"
          enable-cache: true
      - name: Install local tools
        run: brew install ffmpeg gitleaks
      - name: Install locked Python environment
        run: uv sync --locked --extra capture --extra web
      - name: Type, lint, format and tests
        run: make check
      - name: Check public source and history
        run: bash scripts/check-public.sh
      - name: Build distributions
        run: uv build
