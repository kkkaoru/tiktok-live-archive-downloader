<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Ccircle%20cx=%2232%22%20cy=%2232%22%20r=%2231%22%20fill=%22%23bfe6fb%22/%3E%3Cellipse%20cx=%2214%22%20cy=%2246%22%20rx=%227%22%20ry=%224%22%20fill=%22%23cfd8e0%22%20transform=%22rotate%28-25%2014%2046%29%22/%3E%3Cellipse%20cx=%2250%22%20cy=%2246%22%20rx=%227%22%20ry=%224%22%20fill=%22%23cfd8e0%22%20transform=%22rotate%2825%2050%2046%29%22/%3E%3Cellipse%20cx=%2232%22%20cy=%2238%22%20rx=%2222%22%20ry=%2219%22%20fill=%22%23eef2f6%22/%3E%3Ccircle%20cx=%2223%22%20cy=%2233%22%20r=%223.2%22%20fill=%22%231d2430%22/%3E%3Ccircle%20cx=%2241%22%20cy=%2233%22%20r=%223.2%22%20fill=%22%231d2430%22/%3E%3Ccircle%20cx=%2224%22%20cy=%2232%22%20r=%221%22%20fill=%22%23fff%22/%3E%3Ccircle%20cx=%2242%22%20cy=%2232%22%20r=%221%22%20fill=%22%23fff%22/%3E%3Cellipse%20cx=%2232%22%20cy=%2240%22%20rx=%224.5%22%20ry=%223.2%22%20fill=%22%231d2430%22/%3E%3Cellipse%20cx=%2218%22%20cy=%2241%22%20rx=%223%22%20ry=%222%22%20fill=%22%23f7b6c4%22/%3E%3Cellipse%20cx=%2246%22%20cy=%2241%22%20rx=%223%22%20ry=%222%22%20fill=%22%23f7b6c4%22/%3E%3Cg%20stroke=%22%238b97a6%22%20stroke-width=%221%22%20stroke-linecap=%22round%22%3E%3Cpath%20d=%22M24%2043%20L14%2041%22/%3E%3Cpath%20d=%22M24%2045%20L14%2046%22/%3E%3Cpath%20d=%22M40%2043%20L50%2041%22/%3E%3Cpath%20d=%22M40%2045%20L50%2046%22/%3E%3C/g%3E%3Cpath%20d=%22M28%2044%20Q32%2048%2036%2044%22%20stroke=%22%231d2430%22%20stroke-width=%221.4%22%20fill=%22none%22%20stroke-linecap=%22round%22/%3E%3C/svg%3E">
<meta name="color-scheme" content="dark">
<title>TranscriptViewer Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap">
<script>try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
<script>
// A share link (/s/<token>) shows one video without login; every API path gets its prefix.
window.__api = (location.pathname.match(/^\/s\/[A-Za-z0-9_-]+/) || [""])[0];
// Set before first paint so list-page text never flashes on a share link.
if (window.__api) document.documentElement.dataset.share = "";
window.__catalog = fetch(window.__api + "/api/catalog", { cache: "no-cache" }).then(r => r.json());  // always revalidate: syncs replace it
</script>
<style>
  :root { color-scheme: dark; --bg:#0f1115; --panel:#171a21; --panel2:#1d212a; --line:#2a2f3a; --text:#e8eaed; --muted:#9aa3b2; --accent:#6ea8ff; --accent-bg:#1f3a63; --on-accent:#fff; --bar:#4a5468; --playhead:#fff; --radius:10px;
    --tk:#ff7aa8; --tk-line:#6b2a44; --tk-bg:#2a141d; --yt:#ff8a80; --yt-line:#6b2a2a; --yt-bg:#2a1515; --sm:#8ee6a8; --sm-line:#27573a; --sm-bg:#13251a; --err:#ff8a8a; }
  :root[data-theme="light"] { color-scheme: light; --bg:#e4f2fb; --panel:#f4fafe; --panel2:#dcecf7; --line:#bcd6e8; --text:#1b1f27; --muted:#5b6575; --accent:#1a5fd0; --accent-bg:#dbe7fb; --on-accent:#0b1f45; --bar:#9aa6bb; --playhead:#1b1f27;
    --tk:#b3194f; --tk-line:#f0b5c9; --tk-bg:#fdeaf1; --yt:#b3261e; --yt-line:#f0bdb8; --yt-bg:#fdecea; --sm:#1b6b3a; --sm-line:#b4dfc3; --sm-bg:#e7f6ed; --err:#b3261e; }
  @media (prefers-color-scheme: light) { :root:not([data-theme]) { color-scheme: light; --bg:#e4f2fb; --panel:#f4fafe; --panel2:#dcecf7; --line:#bcd6e8; --text:#1b1f27; --muted:#5b6575; --accent:#1a5fd0; --accent-bg:#dbe7fb; --on-accent:#0b1f45; --bar:#9aa6bb; --playhead:#1b1f27;
    --tk:#b3194f; --tk-line:#f0b5c9; --tk-bg:#fdeaf1; --yt:#b3261e; --yt-line:#f0bdb8; --yt-bg:#fdecea; --sm:#1b6b3a; --sm-line:#b4dfc3; --sm-bg:#e7f6ed; --err:#b3261e; } }
  * { box-sizing:border-box; }
  body { margin:0;  font:15px/2 "Noto Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif; background:var(--bg); color:var(--text); }
  header { height:56px; padding:0 16px; border-bottom:1px solid var(--line); background:var(--panel); display:flex; gap:12px; align-items:center; }
  #hsearch { flex:1; display:flex; gap:8px; min-width:0; }
  #hsearch input { flex:1; min-width:0; max-width:none; padding-left:1em; }
  .mobile-only { display:none; }
  header a { color:var(--muted); font-size:13px; text-decoration:none; white-space:nowrap; }
  header a:hover { color:var(--text); }
  main { display:flex; height:calc(100dvh - 56px); }
  #list { width:340px; min-width:260px; overflow-y:auto; border-right:1px solid var(--line); background:var(--panel); overscroll-behavior:contain; }
  .vitem { padding:10px 14px; cursor:pointer; border-bottom:1px solid var(--line); border-left:3px solid transparent; content-visibility:auto; contain-intrinsic-size:auto 64px; }
  .vitem:hover { background:var(--panel2); }
  .vitem.sel { background:var(--accent-bg); border-left-color:var(--accent); }
  .vitem .d { font-variant-numeric:tabular-nums; font-size:13px; color:var(--accent); }
  .vitem .t { color:var(--text); font-size:13px; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tag { display:inline-block; font-size:11px; line-height:2; padding:0 8px; border-radius:999px; margin-right:6px; font-weight:600; vertical-align:middle; border:1px solid transparent; }
  .tag.tiktok { color:var(--tk); border-color:var(--tk-line); background:var(--tk-bg); }
  .tag.youtube { color:var(--yt); border-color:var(--yt-line); background:var(--yt-bg); }
  .tag .ico { width:1.1em; height:1.1em; vertical-align:-0.2em; margin-right:.35em; }
  .tag.other { color:var(--muted); border-color:var(--line); }
  .tag.sum { color:var(--sm); border-color:var(--sm-line); background:var(--sm-bg); }
  #streamersPage { padding:20px 16px; max-width:960px; margin:0 auto; }
  #streamerGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
  a.scard { display:block; padding:14px 16px; border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); color:var(--text); text-decoration:none; }
  a.scard:hover { border-color:var(--accent); }
  a.scard:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  a.scard .name { font-weight:700; font-size:17px; }
  a.scard .meta { color:var(--muted); font-size:13px; }
  body[data-page="streamers"] main, body[data-page="streamers"] #backBtn { display:none; }
  body:not([data-page="streamers"]) #streamersPage { display:none; }
  #crumbs { padding:6px 14px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted); }
  #crumbs a { color:var(--accent); text-decoration:none; }
  .tag.streamer { color:var(--accent); border-color:var(--accent); background:var(--accent-bg); }
  #calendar { padding:8px 12px 10px; border-bottom:1px solid var(--line); }
  .cal-head { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:4px; font-weight:700; }
  .cal-head button { padding:0 10px; min-height:32px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; }
  .cal-dow { font-size:11px; color:var(--muted); line-height:1.6; }
  .cal-grid .cal-day { padding:0; min-height:34px; line-height:34px; border:1px solid transparent; background:transparent; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; position:relative; }
  .cal-grid .cal-day:disabled { opacity:.45; cursor:default; }
  .cal-grid .cal-day.has { color:var(--text); font-weight:700; background:var(--accent-bg); border-color:var(--accent); }
  .cal-grid .cal-day.sel { background:var(--accent); color:#fff; }
  .cal-grid .cal-day.today { outline:1px dashed var(--muted); outline-offset:-3px; }
  .cal-note { font-size:12px; color:var(--muted); margin-top:4px; display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .cal-note button { padding:0 10px; min-height:28px; font-size:12px; }
  #filters { display:flex; gap:6px; padding:10px 12px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); z-index:1; }
  #filters button { padding:4px 10px; border-radius:999px; font-size:13px; }
  #filters button .ico { width:1em; height:1em; vertical-align:-0.15em; }
  #filters button.on { background:var(--accent-bg); border-color:var(--accent); color:var(--on-accent); }
  .hit { display:flex !important; gap:12px; align-items:flex-start; content-visibility:auto; contain-intrinsic-size:auto 96px; }
  .hit .thumb { flex:none; width:160px; height:96px; background:#0b0d12; border-radius:6px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .hit .thumb canvas { max-width:100%; max-height:100%; width:auto; height:auto; border-radius:0; cursor:inherit; background:none; }
  .hit .meta { min-width:0; }
  .hit .meta .when { color:var(--accent); font-size:12px; font-variant-numeric:tabular-nums; }
  #detail { flex:1; overflow-y:auto; padding:20px; min-width:0; }
  #detail > * { max-width:960px; margin-inline:auto; }
  #empty { color:var(--muted); text-align:center; margin-top:20vh; }
  h2 { font-size:18px; margin:0 0 12px; }
  h3 { font-size:14px; color:var(--muted); margin:22px 0 8px; font-weight:600; }
  video { display:block; width:100%; aspect-ratio:16/9; max-height:56dvh; background:#000; border-radius:var(--radius); }
  button, input { line-height:inherit; }
  button, input[type=text], input[type=search] { font:inherit; line-height:inherit; font-size:14px; padding:7px 12px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); color:var(--text); cursor:pointer; }
  button:hover { border-color:#3b4252; }
  button:focus-visible, input:focus-visible, .vitem:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  input[type=text], input[type=search] { cursor:text; }
  .seg { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:12px; color:var(--muted); font-size:13px; }
  .seg button.on { background:var(--accent-bg); border-color:var(--accent); color:var(--on-accent); }
  #cur { font-size:24px; min-height:68px; margin:8px 0 2px; }
  #curTime { color:var(--muted); font-variant-numeric:tabular-nums; min-height:22px; }
  input[type=range] { width:100%; height:32px; accent-color:var(--accent); }
  #nearby { display:flex; gap:8px; overflow-x:auto; padding:6px 0; min-height:96px; }
  .near { min-width:280px; max-width:360px; text-align:left; white-space:normal; flex:none; }
  .near.sel { border-color:var(--accent); background:var(--accent-bg); }
  /* Each list scrolls inside its own box, sized to the visible pane minus the header and tab row. */
  #utts, #sumBody { max-height:calc(100dvh - 56px - 96px); overflow-y:auto; }
  #utts { border:1px solid var(--line); border-radius:var(--radius); }
  #videoSlot.floating video { position:fixed; right:16px; top:72px; width:min(360px,calc(100vw - 32px)); height:auto; max-height:none; z-index:10; box-shadow:0 8px 24px rgba(0,0,0,.5); }
  .utt { display:flex; gap:14px; padding:9px 12px; cursor:pointer; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid var(--line); border-radius:0; color:var(--text); content-visibility:auto; contain-intrinsic-size:auto 44px; }
  .utt:hover { background:var(--panel2); } .utt.sel { background:var(--accent-bg); }
  .utt .ts { font-variant-numeric:tabular-nums; color:var(--accent); white-space:nowrap; }
  .spk { display:inline-block; padding:1px 8px; margin-right:6px; border-radius:10px; font-size:.8em; font-weight:700; color:#1d1d1f; white-space:nowrap; vertical-align:middle; }
  .tab { display:none; } .tab.on { display:block; }
  dialog { background:var(--panel); color:var(--text); width:min(760px,92vw); max-height:84dvh; border:1px solid var(--line); border-radius:14px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  .hit { display:block; width:100%; text-align:left; margin:4px 0; white-space:normal; }
  .sect { margin:14px 0; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); }
  .sect p { margin:8px 0 0; } .sect button { font-variant-numeric:tabular-nums; }
  canvas { width:100%; height:28px; display:block; background:var(--panel2); border-radius:6px; cursor:pointer; }
  #exBar { height:48px; }
  #exInfo { min-height:24px; font-variant-numeric:tabular-nums; }
  .note { color:var(--muted); font-size:13px; }
  a.btn { display:inline-block; font-size:14px; padding:7px 12px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); color:var(--text); text-decoration:none; }
  a.btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  input[type=number] { font:inherit; font-size:14px; width:6em; padding:7px 12px; border:1px solid var(--line); border-radius:8px; background:var(--panel2); color:var(--text); }
  #shareList { padding:0; } #shareList li { list-style:none; display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  #shareList input { flex:1; min-width:12em; }
  [data-share] #list, [data-share] #backBtn, [data-share] #logoutLink, [data-share] #scopeGroup, [data-share] #empty { display:none !important; }
  @media (max-width: 760px) {
    header { padding:0 12px; gap:8px; } header a { display:none; }
    .mobile-only { display:inline-block; } body[data-view="list"] #backBtn { display:none; }
    main { flex-direction:column; height:calc(100dvh - 56px); }
    body[data-view="player"] #list, body:not([data-view="player"]) #detail { display:none; }
    #list { width:auto; min-width:0; flex:1; border-right:none; }
    #detail { overflow-y:auto; padding:12px; }
    #cur { font-size:19px; min-height:54px; }
    .near { min-width:230px; }
    button, input[type=text] { min-height:44px; }
    video { max-height:40dvh; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; } }
</style>
</head>
<body data-view="list">
<header>
  <button id="backBtn" class="mobile-only" aria-label="一覧へ戻る">←</button>
  <form id="hsearch" role="search"><input id="q" type="search" placeholder="文字起こし・要約を検索（すべての動画）" autocomplete="off" aria-label="検索"><button>検索</button></form>
  <a id="adminLink" href="/admin" hidden>許可管理</a>
  <button id="settingsBtn" aria-label="設定">設定</button>
  <a id="logoutLink" href="/auth/logout">ログアウト</a>
</header>
<section id="streamersPage" aria-label="配信者一覧"><h2>配信者</h2><div id="streamerGrid"></div></section>
<main>
  <div id="listWrap" style="display:contents">
  <nav id="list" aria-label="動画一覧"><div id="crumbs"><a href="/streamers" id="crumbHome">配信者一覧</a><span aria-hidden="true"> / </span><span id="crumbName"></span></div><div id="calendar" aria-label="日付で絞り込み"></div><div id="filters" role="group" aria-label="種別で絞り込み"></div><div id="items"></div></nav>
  </div>
  <section id="detail">
    <p id="empty">左の一覧から動画を選んでください</p>
    <div id="player" hidden>
      <h2 id="title"></h2><div id="titleTags"></div>
      <div id="videoSlot"><video id="video" controls preload="metadata" playsinline></video></div>
      <div class="seg" role="group" aria-label="素材の切り替え">
        素材:
        <button id="srcEdited" class="on">編集済み</button><button id="srcOriginal">元動画</button>
        <span class="note" id="srcNote"></span>
      </div>
      <div class="seg" role="group" aria-label="ダウンロードと共有">
        ダウンロード:
        <a id="dlVideo" class="btn" href="#">動画データ</a><button id="dlText">文字起こし・要約</button>
        <button id="shareBtn" hidden>共有</button>
        <span class="note" id="shareNote"></span>
      </div>
      <h3>タイムライン</h3>
      <div id="cur">発話なし</div><div id="curTime"></div>
      <input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="再生位置">
      <canvas id="bar" width="1200" height="28"></canvas>
      <div id="excite" hidden>
        <div class="seg" role="group" aria-label="盛り上がりの表示">
          盛り上がり（この動画内の相対値）:
          <span id="exModes"><button id="exCombined">合算</button><button id="exSplit">別々</button></span>
          <span class="note" id="exNote"></span>
        </div>
        <canvas id="exBar" aria-label="盛り上がりのタイムライン。クリックでその位置へ移動"></canvas>
        <div id="exInfo" class="note"></div>
        <div class="seg" id="exPeaks" role="group" aria-label="盛り上がり箇所へ移動"></div>
      </div>
      <div id="nearby" aria-label="付近の発話"></div>
      <div class="seg" role="group" aria-label="表示内容">
        <button id="tabSumBtn">要約</button><button id="tabUttBtn" class="on">認識結果</button>
        <button id="popSum">要約を別ウィンドウで開く</button><button id="popUtt">認識結果を別ウィンドウで開く</button>
      </div>
      <div id="tabSummary" class="tab"><div id="sumBody"></div></div>
      <div id="tabUtter" class="tab on"><div id="utts"></div></div>
    </div>
  </section>
</main>
<dialog id="searchDlg">
  <form method="dialog"><button style="float:right">閉じる</button></form>
  <h3 id="searchHeading">検索</h3>
  <div class="seg" role="group" aria-label="検索対象">
    検索対象:
    <label><input type="radio" name="mode" value="transcript" checked> 文字起こし</label>
    <label><input type="radio" name="mode" value="summary"> 要約</label>
    <label><input type="radio" name="mode" value="both"> 文字起こしと要約</label>
  </div>
  <div class="seg" id="scopeGroup" role="group" aria-label="検索範囲">
    範囲:
    <label><input type="radio" name="scope" value="current"> この動画</label>
    <label><input type="radio" name="scope" value="all" checked> すべての動画</label>
  </div>
  <p id="searchStatus" class="note"></p>
  <div id="hits"></div>
</dialog>
<dialog id="shareDlg">
  <form method="dialog"><button style="float:right">閉じる</button></form>
  <h3>共有リンク</h3>
  <p class="note">リンクを知っている人は、ログインなしでこの動画だけを表示・ダウンロードできます。</p>
  <form id="shareForm">
    <div class="seg" role="group" aria-label="共有する動画">
      共有する動画:
      <label><input type="checkbox" id="shEdited"> 編集済み</label>
      <label><input type="checkbox" id="shOriginal"> 元動画</label>
    </div>
    <div class="seg"><label>表示期間 <input type="number" id="shDays" min="1" max="365" value="7" required> 日</label><button>リンクを発行</button></div>
  </form>
  <p id="shareMsg" class="note" role="status"></p>
  <ul id="shareList"></ul>
</dialog>
<dialog id="settingsDlg">
  <form method="dialog"><button style="float:right">閉じる</button></form>
  <h3>設定</h3>
  <fieldset style="border:1px solid var(--line);border-radius:8px">
    <legend class="note">テーマ</legend>
    <label><input type="radio" name="theme" value="auto" checked> 自動（端末の設定に従う）</label><br>
    <label><input type="radio" name="theme" value="light"> ノーマル（ライト）</label><br>
    <label><input type="radio" name="theme" value="dark"> ダークモード</label>
  </fieldset>
</dialog>
<script>
const $ = s => document.querySelector(s);
const API = window.__api, SHARE = Boolean(API);
// Kept as element references: a pop-out window adopts these nodes, so $() would miss them.
const UTTS = $("#utts"), SUMMARY = $("#sumBody");
const mediaSrc = (v, kind) => kind === "original" ? `${API}/media-original/${v.original.movie}` : `${API}/media/${v.movie}`;
const state = { date: "", month: null, navs: 0, streamer: "", filter: "all", videos: [], current: null, data: new Map(), utterances: [], curIdx: -2, source: "edited" };
const fmt = s => { s = Math.max(0, Math.floor(s)); const h = s/3600|0, m = s%3600/60|0, r = s%60;

  const lead = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), days = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const today = new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
  for (let i = 0; i < lead; i++) grid.appendChild(document.createElement("div"));
  for (let d = 1; d <= days; d++) {
    const ymd = `${y}-${pad(m)}-${pad(d)}`, n = counts.get(ymd) || 0, b = document.createElement("button");
    b.className = "cal-day" + (n ? " has" : "") + (state.date === ymd ? " sel" : "") + (ymd === today ? " today" : "");
    b.textContent = d; b.disabled = !n;
    b.setAttribute("aria-label", `${m}月${d}日 ${n ? "動画あり" : "動画なし"}`);
    b.setAttribute("aria-pressed", state.date === ymd ? "true" : "false");
    b.onclick = () => setDate(state.date === ymd ? "" : ymd);
    grid.appendChild(b);
  }
  box.replaceChildren(head, grid);
  if (!state.date) return;
  const note = document.createElement("div"); note.className = "cal-note";
  const text = document.createElement("span"); text.textContent = state.date;
  const clear = document.createElement("button"); clear.textContent = "解除"; clear.onclick = () => setDate("");
  note.append(text, clear); box.appendChild(note);
}
function shiftMonth(delta) {
  const t = new Date(Date.UTC(state.month.y, state.month.m - 1 + delta, 1));
  state.month = { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1 }; renderCalendar();
}
function setDate(ymd) {
  state.date = ymd;
  if (ymd) state.month = { y: +ymd.slice(0, 4), m: +ymd.slice(5, 7) };
  const url = new URL(location.href);
  if (ymd) url.searchParams.set("date", ymd); else url.searchParams.delete("date");
  history.replaceState(null, "", url);
  renderCalendar(); renderFilters(); loadList();
}
const dateQuery = () => (state.date ? `?date=${state.date}` : "");

// Routing: /streamers, /streamers/<name>, /streamers/<name>/videos/<id> (History API; the worker
// serves this page for all three). On phones the list and player are separate pages
// (body[data-view]); on desktop both stay visible.
const STREAMERS = "/streamers";
const streamerPath = name => `${STREAMERS}/${encodeURIComponent(name)}`;
const pathFor = v => `${streamerPath(streamerOf(v))}/videos/${encodeURIComponent(v.id)}`;
function navigate(path, { replace = false } = {}) {
  if (location.pathname + location.search !== path) { history[replace ? "replaceState" : "pushState"](null, "", path); state.navs++; }
  route();
}
function link(a, path) {
  a.href = path;
  a.onclick = e => { if (e.button || e.metaKey || e.ctrlKey || e.shiftKey) return; e.preventDefault(); navigate(path); };
}
function go(v, seekTo = 0) {
  if (SHARE) { seek(seekTo); return; }
  state.pendingSeek = seekTo;
  if (state.date && dateOf(v) !== state.date) state.date = ""; // a search hit may fall outside the filtered day
  navigate(pathFor(v) + dateQuery());
}
function showStreamers() {
  document.body.dataset.page = "streamers"; document.title = "配信者一覧";
  const names = [...new Set(state.videos.map(streamerOf))].sort();
  const grid = document.createDocumentFragment();
  for (const name of names) {
    const pool = videosOf(name), a = document.createElement("a");
    a.className = "scard";
    a.innerHTML = `<div class="name"></div><div class="meta"></div>`;
    a.querySelector(".name").textContent = name;
    const latest = pool.map(v => v.broadcastStartJST ?? "").sort().pop();
    a.querySelector(".meta").textContent = latest ? `最新 ${latest}` : "";
    link(a, streamerPath(name)); grid.appendChild(a);
  }
  $("#streamerGrid").replaceChildren(grid);
}
function route() {
  if (SHARE) {
    const v = state.videos[0];
    document.body.dataset.page = "videos"; document.body.dataset.view = "player";
    document.title = `${v.broadcastStartJST ?? ""} ${v.streamer}`;
    $("#q").placeholder = "文字起こし・要約を検索（この動画）";
    select(v); return;
  }
  const parts = location.pathname.split("/").filter(Boolean).map(decodeURIComponent);
  if (parts[0] !== "streamers") { navigate(STREAMERS, { replace: true }); return; }
  if (parts.length === 1) { showStreamers(); return; }
  document.body.dataset.page = "videos";
  if (state.streamer !== parts[1]) state.month = null;
  state.streamer = parts[1]; $("#crumbName").textContent = state.streamer; link($("#crumbHome"), STREAMERS);
  const wanted = new URLSearchParams(location.search).get("date") || "";
  state.date = /^\d{4}-\d{2}-\d{2}$/.test(wanted) ? wanted : "";
  if (state.date) state.month = { y: +state.date.slice(0, 4), m: +state.date.slice(5, 7) };
  renderCalendar(); renderFilters(); loadList();
  const v = parts[2] === "videos" ? videosOf(state.streamer).find(x => x.id === parts[3]) : undefined;
  if (v) {
    document.body.dataset.view = "player"; document.title = `${v.broadcastStartJST ?? ""} ${state.streamer}`;
    const t = state.pendingSeek || 0; state.pendingSeek = 0;
    if (state.current !== v) select(v, t); else if (t) seek(t);
  } else {
    document.body.dataset.view = "list"; document.title = state.streamer;
    if (matchMedia("(max-width: 760px)").matches) $("#video").pause();
  }
}
addEventListener("popstate", route);
$("#backBtn").onclick = () => { if (state.navs > 0) history.back(); else navigate(streamerPath(state.streamer) + dateQuery()); };
$("#hsearch").onsubmit = e => { e.preventDefault(); if ($("#q").value.trim()) { $("#searchDlg").showModal(); runSearch(); } };
document.querySelectorAll("input[name=scope], input[name=mode]").forEach(r => r.onchange = () => runSearch());
{ let saved = "transcript"; try { saved = localStorage.getItem("searchMode") || saved; } catch {}
  const r = document.querySelector(`input[name=mode][value="${saved}"]`); if (r) r.checked = true; }

// One hit per matching utterance and per matching summary part. Summary hits jump to the
// section start (the overview jumps to the beginning) and show text around the match.
const SNIPPET = 40;
function snippet(text, q) {
  const i = text.indexOf(q), from = Math.max(0, i - SNIPPET), to = Math.min(text.length, i + q.length + SNIPPET);
  return (from > 0 ? "…" : "") + text.slice(from, to).replace(/\s+/g, " ") + (to < text.length ? "…" : "");
}
function hitsFor(data, q, mode) {
  const out = [];
  // Summary parts come first so they are not crowded out by the many transcript hits.
  if (mode !== "transcript" && data.summary) {
    if (data.summary.overview.includes(q)) out.push({ start: 0, label: "全体", text: snippet(data.summary.overview, q), kind: "要約" });
    for (const sec of data.summary.sections) if (sec.text.includes(q)) out.push({ start: sec.start, label: fmt(sec.start), text: snippet(sec.text, q), kind: "要約" });
  }
  if (mode !== "summary") {
    for (const u of utterancesFrom(data.cues)) if (u.text.includes(q)) out.push({ start: u.start, label: u.startLabel, text: u.text, kind: "文字起こし" });
  }
  return out;
}
async function runSearch() {
  const q = $("#q").value.trim(); if (!q) return;
  const all = document.querySelector("input[name=scope]:checked").value === "all";
  const targets = all ? state.videos : (state.current ? [state.current] : []);
  const token = state.searchToken = (state.searchToken || 0) + 1;
  const hits = $("#hits"); hits.textContent = "";
  $("#searchStatus").textContent = "検索中…";
  let count = 0;
  // Fetch in parallel batches so a cross-video search is not N sequential round trips.
  for (let i = 0; i < targets.length; i += 6) await Promise.all(targets.slice(i, i + 6).map(v => getData(v.id)));
  const mode = document.querySelector("input[name=mode]:checked").value;
  try { localStorage.setItem("searchMode", mode); } catch {}
  const frag = document.createDocumentFragment();
  for (const v of targets) {
    const data = await getData(v.id);
    for (const h of hitsFor(data, q, mode)) {
      count++;
      if (count > HIT_LIMIT) continue;
      const b = document.createElement("button");
      b.className = "hit";
      const thumb = document.createElement("span"); thumb.className = "thumb"; thumb.dataset.t = h.start; thumb.dataset.src = mediaSrc(v, v.movie ? "edited" : "original");
      const meta = document.createElement("span"); meta.className = "meta";
      const when = document.createElement("span"); when.className = "when"; when.textContent = `${v.broadcastStartJST ?? ""} ${h.label}`;
      const text = document.createElement("span"); text.style.display = "block"; text.textContent = h.text;
      meta.append(tagEl(h.kind, h.kind === "要約" ? "sum" : "other"), when, text);
      b.append(thumb, meta);
      b.onclick = () => { $("#searchDlg").close(); go(v, h.start); };
      frag.appendChild(b); thumbObserver.observe(thumb);
    }
  }
  if (token !== state.searchToken) return;
  hits.replaceChildren(frag);
  $("#searchStatus").textContent = count > HIT_LIMIT ? `${count}件（先頭${HIT_LIMIT}件を表示）` : `${count}件`;
}
if (!SHARE) fetch("/api/me").then(r => r.json()).then(m => { $("#adminLink").hidden = !m.admin; $("#shareBtn").hidden = !m.admin; }).catch(() => {});
// Downloads are two files on purpose: a multi-GB movie streams straight from R2 (resumable
// via Range), while the transcript and summary are a small text built here from the data.
function syncDownload() {
  const v = state.current; if (!v) return;
  $("#dlVideo").href = mediaSrc(v, state.source) + "?download=1";
  getData(v.id).then(d => { $("#dlText").hidden = !d.cues.length && !d.summary; });
}
async function transcriptText(v) {
  const d = await getData(v.id), out = [`${v.broadcastStartJST ?? ""} ${v.title}`, ""];
  if (d.summary) {
    out.push("■ 要約", d.summary.overview, "");
    for (const s of d.summary.sections) out.push(`[${fmt(s.start)} – ${fmt(s.end)}]`, s.text, "");
  }
  if (d.cues.length) out.push("■ 文字起こし", ...utterancesFrom(d.cues).map(u => `[${u.startLabel}] ${u.text.replace(/\n/g, " ")}`));
  return out.join("\n") + "\n";
}
$("#dlText").onclick = async () => {
  const v = state.current; if (!v) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([await transcriptText(v)], { type: "text/plain;charset=utf-8" }));
  a.download = `${v.id}-transcript-summary.txt`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
const shareUrl = s => `${location.origin}/s/${s.token}`;
async function shareCall(method, body) {
  const r = await fetch("/api/admin/shares", { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "失敗しました");
  return d;
}
async function loadShares() {
  const v = state.current, now = Date.now() / 1000;
  const { shares } = await (await fetch(`/api/admin/shares?video=${encodeURIComponent(v.id)}`)).json();
  $("#shareList").replaceChildren(...shares.map(s => {
    const li = document.createElement("li"), url = document.createElement("input"), copy = document.createElement("button"), off = document.createElement("button"), info = document.createElement("span");
    url.type = "text"; url.readOnly = true; url.value = shareUrl(s); url.setAttribute("aria-label", "共有URL");
    info.className = "note";
    info.textContent = [s.video.movie && "編集済み", s.video.original && "元動画"].filter(Boolean).join("・") + " / " + (s.expiresAt > now ? `${new Date(s.expiresAt * 1000).toLocaleString("ja-JP")}まで` : "期限切れ");
    copy.textContent = "コピー"; copy.onclick = () => navigator.clipboard.writeText(url.value).then(() => { $("#shareMsg").textContent = "コピーしました"; });
    off.textContent = "オフにする"; off.onclick = () => shareCall("DELETE", { token: s.token }).then(loadShares, e => { $("#shareMsg").textContent = e.message; });
    li.append(url, copy, off, info); return li;
  }));
}
$("#shareBtn").onclick = () => {
  const v = state.current;
  $("#shEdited").disabled = !v.movie; $("#shEdited").checked = Boolean(v.movie);
  $("#shOriginal").disabled = !v.original; $("#shOriginal").checked = !v.movie && Boolean(v.original);
  $("#shareMsg").textContent = ""; $("#shareDlg").showModal(); loadShares();
};
$("#shareForm").onsubmit = async e => {
  e.preventDefault();
  try {
    const { share } = await shareCall("POST", { videoId: state.current.id, edited: $("#shEdited").checked, original: $("#shOriginal").checked, days: +$("#shDays").value });
    $("#shareMsg").textContent = `発行しました: ${shareUrl(share)}`; loadShares();
  } catch (err) { $("#shareMsg").textContent = err.message; }
};
window.__catalog.then(c => { state.videos = c.videos; route(); });
</script>
